spring:
  application:
    name: gsecp-backend
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

gsecp:
  jwt:
    # 生产环境必须通过环境变量 GSECP_JWT_SECRET 覆盖，长度不少于 32 字符
    secret: ${GSECP_JWT_SECRET:gsecp-dev-only-jwt-secret-key-change-me-2026}
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  storage:
    local-dir: ./data/uploads
  bootstrap:
    enabled: true
    admin-username: admin
    # 生产环境必须通过环境变量 GSECP_ADMIN_PASSWORD 覆盖
    admin-password: ${GSECP_ADMIN_PASSWORD:Admin@123456}

logging:
  level:
    com.gsecp: debug
