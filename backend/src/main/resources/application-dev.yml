spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gsecp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${GSECP_DB_USERNAME:root}
    # 不内置真实密码：启动前必须设置环境变量 GSECP_DB_PASSWORD（见 README）
    password: ${GSECP_DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

logging:
  level:
    org.hibernate.SQL: info
